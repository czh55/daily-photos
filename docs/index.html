ection/search/436418", "id": 570}, {"title": "Lighting a Hanging Lantern for the Obon Festival", "photographer": "Shibata Zeshin 柴田是真", "desc": "构图上，Lighting a Hanging Lantern for the Obon Festival以光影元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，Shibata Zeshin 柴田是真的镜头传递出对光影题材的独到观察与共鸣。", "tags": ["光影", "met", "art"], "img": "https://images.metmuseum.org/CRDImages/as/original/DP142166.jpg", "category": "光影", "source": "met", "source_url": "https://www.metmuseum.org/art/collection/search/45265", "id": 602}, {"title": "Chess Set", "photographer": "Met Museum", "desc": "构图上，Chess Set以黑白元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，Met Museum的镜头传递出对黑白题材的独到观察与共鸣。", "tags": ["黑白", "met", "art"], "img": "https://images.metmuseum.org/CRDImages/is/original/DP170393.jpg", "category": "黑白", "source": "met", "source_url": "https://www.metmuseum.org/art/collection/search/452204", "id": 258}, {"title": "A Farm in Brittany", "photographer": "Paul Gauguin", "desc": "构图上，A Farm in Brittany以黑白元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，Paul Gauguin的镜头传递出对黑白题材的独到观察与共鸣。", "tags": ["黑白", "met", "art"], "img": "https://images.metmuseum.org/CRDImages/ep/original/DP123847.jpg", "category": "黑白", "source": "met", "source_url": "https://www.metmuseum.org/art/collection/search/436448", "id": 624}, {"title": "Majas on a Balcony", "photographer": "Goya (Francisco de Goya y Lucientes)", "desc": "构图上，Majas on a Balcony以纪实元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，Goya (Francisco de Goya y Lucientes)的镜头传递出对纪实题材的独到观察与共鸣。", "tags": ["纪实", "met", "art"], "img": "https://images.metmuseum.org/CRDImages/ep/original/DP-20750-001.jpg", "category": "纪实", "source": "met", "source_url": "https://www.metmuseum.org/art/collection/search/436548", "id": 103}];

(function() {
  var footerYearEl = document.getElementById('footerYear');
  if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();

  var categories = ['全部'].concat(
    Array.from(new Set(photos.map(function(p) { return p.category; })))
  );

  var filterBar = document.getElementById('filterBar');
  categories.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === '全部' ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', function() {
      var buttons = document.querySelectorAll('.filter-btn');
      for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
      btn.classList.add('active');
      renderGallery(cat === '全部' ? null : cat);
    });
    filterBar.appendChild(btn);
  });

  function sourceLabel(src) {
    var labels = {
      openverse: 'Openverse',
      wikimedia: 'Wikimedia',
      nasa: 'NASA',
      met: 'Met Museum',
      unsplash: 'Unsplash',
      pexels: 'Pexels',
      pixabay: 'Pixabay',
      rawpixel: 'Rawpixel'
    };
    return labels[src] || src || '';
  }

  function renderGallery(filter) {
    var gallery = document.getElementById('gallery');
    var filtered = filter ? photos.filter(function(p) { return p.category === filter; }) : photos;
    gallery.innerHTML = filtered.map(function(p, i) {
      var srcLine = p.source ? '<p class="source-label">' + sourceLabel(p.source) + '</p>' : '';
      return '<div class="photo-card" data-index="' + i + '" data-img="' + p.img + '" data-caption="' + p.title + ' \u2014 ' + p.photographer + '">' +
        '<div class="img-wrap">' +
          '<img src="' + p.img + '" alt="' + p.title + '" loading="lazy">' +
          '<span class="badge">' + p.tags[0] + '</span>' +
          '<span class="rank">#' + (i + 1) + '</span>' +
        '</div>' +
        '<div class="info">' +
          '<h3>' + p.title + '</h3>' +
          '<p class="photographer">' + p.photographer + '</p>' +
          srcLine +
          '<p class="desc">' + p.desc + '</p>' +
          '<div class="tags">' + p.tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var cards = document.querySelectorAll('.photo-card');
    for (var j = 0; j < cards.length; j++) {
      cards[j].addEventListener('click', function() {
        document.getElementById('lightboxImg').src = this.dataset.img;
        document.getElementById('lightboxCaption').textContent = this.dataset.caption;
        document.getElementById('lightbox').classList.add('active');
      });
    }
  }

  document.getElementById('lightboxClose').addEventListener('click', function() {
    document.getElementById('lightbox').classList.remove('active');
  });
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === e.currentTarget) document.getElementById('lightbox').classList.remove('active');
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
  });

  renderGallery(null);
})();
</script>
