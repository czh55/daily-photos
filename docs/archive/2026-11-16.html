gin and Child", "photographer": "Met Museum", "desc": "构图上，Virgin and Child以黑白元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，Met Museum的镜头传递出对黑白题材的独到观察与共鸣。", "tags": ["黑白", "met", "art"], "img": "https://images.metmuseum.org/CRDImages/md/original/DP-34069-001.jpg", "category": "黑白", "source": "met", "source_url": "https://www.metmuseum.org/art/collection/search/464294", "id": 640}, {"title": "The Holy Family with the Infant Saint John the Baptist", "photographer": "Sassoferrato (Giovanni Battista Salvi)", "desc": "构图上，The Holy Family with the Infant Saint John the Baptist以黑白元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，Sassoferrato (Giovanni Battista Salvi)的镜头传递出对黑白题材的独到观察与共鸣。", "tags": ["黑白", "met", "art"], "img": "https://images.metmuseum.org/CRDImages/dp/original/DP801532.jpg", "category": "黑白", "source": "met", "source_url": "https://www.metmuseum.org/art/collection/search/341171", "id": 827}, {"title": "The Penitence of Saint Jerome", "photographer": "Joachim Patinir", "desc": "构图上，The Penitence of Saint Jerome以自然元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，Joachim Patinir的镜头传递出对自然题材的独到观察与共鸣。", "tags": ["自然", "met", "art"], "img": "https://images.metmuseum.org/CRDImages/ep/original/DT5549.jpg", "category": "自然", "source": "met", "source_url": "https://www.metmuseum.org/art/collection/search/437261", "id": 148}, {"title": "Earth Observations taken by the Expedition 23 Crew", "photographer": "NASA", "desc": "构图上，Earth Observations taken by the Expedition 23 Crew以黑白元素形成清晰视觉焦点；光影层次丰富，明暗对比赋予画面深度与空间感；情感表达上，NASA的镜头传递出对黑白题材的独到观察与共鸣。", "tags": ["黑白", "nasa", "space"], "img": "https://images-assets.nasa.gov/image/iss023e057948/iss023e057948~orig.jpg", "category": "黑白", "source": "nasa", "source_url": "https://images.nasa.gov/details-iss023e057948", "id": 129}];

(function() {
  var footerYearEl = document.getElementById('footerYear');
  if (footerYearEl) footerYearEl.textContent = new Date().getFullYear();

  var categories = ['全部'].concat(
    Array.from(new Set(photos.map(function(p) { return p.category; })))
  );

  var filterBar = document.getElementById('filterBar');
  categories.forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === '全部' ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', function() {
      var buttons = document.querySelectorAll('.filter-btn');
      for (var i = 0; i < buttons.length; i++) buttons[i].classList.remove('active');
      btn.classList.add('active');
      renderGallery(cat === '全部' ? null : cat);
    });
    filterBar.appendChild(btn);
  });

  function sourceLabel(src) {
    var labels = {
      openverse: 'Openverse',
      wikimedia: 'Wikimedia',
      nasa: 'NASA',
      met: 'Met Museum',
      unsplash: 'Unsplash',
      pexels: 'Pexels',
      pixabay: 'Pixabay',
      rawpixel: 'Rawpixel'
    };
    return labels[src] || src || '';
  }

  function renderGallery(filter) {
    var gallery = document.getElementById('gallery');
    var filtered = filter ? photos.filter(function(p) { return p.category === filter; }) : photos;
    gallery.innerHTML = filtered.map(function(p, i) {
      var srcLine = p.source ? '<p class="source-label">' + sourceLabel(p.source) + '</p>' : '';
      return '<div class="photo-card" data-index="' + i + '" data-img="' + p.img + '" data-caption="' + p.title + ' \u2014 ' + p.photographer + '">' +
        '<div class="img-wrap">' +
          '<img src="' + p.img + '" alt="' + p.title + '" loading="lazy">' +
          '<span class="badge">' + p.tags[0] + '</span>' +
          '<span class="rank">#' + (i + 1) + '</span>' +
        '</div>' +
        '<div class="info">' +
          '<h3>' + p.title + '</h3>' +
          '<p class="photographer">' + p.photographer + '</p>' +
          srcLine +
          '<p class="desc">' + p.desc + '</p>' +
          '<div class="tags">' + p.tags.map(function(t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');

    var cards = document.querySelectorAll('.photo-card');
    for (var j = 0; j < cards.length; j++) {
      cards[j].addEventListener('click', function() {
        document.getElementById('lightboxImg').src = this.dataset.img;
        document.getElementById('lightboxCaption').textContent = this.dataset.caption;
        document.getElementById('lightbox').classList.add('active');
      });
    }
  }

  document.getElementById('lightboxClose').addEventListener('click', function() {
    document.getElementById('lightbox').classList.remove('active');
  });
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === e.currentTarget) document.getElementById('lightbox').classList.remove('active');
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
  });

  renderGallery(null);
})();
</script>
